# ==========================================================================
# Configuration Netlify — site vitrine Cappellina
# Site statique : aucune commande de build, on publie la racine du dépôt.
# ==========================================================================

[build]
  publish = "."

# --------------------------------------------------------------------------
# En-têtes de sécurité appliqués à toutes les pages
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --------------------------------------------------------------------------
# Mise en cache des ressources statiques
# Une semaine : suffisant pour les performances, sans bloquer une mise à jour
# du logo ou d'une photo pendant des mois.
# --------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# Les fichiers de données sont réécrits par l'espace admin : ils doivent être
# revalidés à chaque visite, sinon une modification de l'agenda mettrait
# jusqu'à une semaine à apparaître dans les navigateurs déjà venus.
[[headers]]
  for = "/assets/data/*"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# L'espace admin ne doit être ni mis en cache ni indexé
[[headers]]
  for = "/admin/*"

  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# --------------------------------------------------------------------------
# Redirections
# Netlify sert automatiquement /404.html pour les pages inconnues.
# L'ancienne page d'accueil Google Sites peut être redirigée ici si besoin :
#   [[redirects]]
#     from = "/ancienne-adresse"
#     to = "/"
#     status = 301
# --------------------------------------------------------------------------
