  Espace d'administration du site Cappellina.

  Decap CMS, même outil que le site Kanjo Aïkido : l'authentification passe
  par le fournisseur OAuth GitHub de Netlify, à activer dans les réglages du
  site (Access control → OAuth → GitHub).

  Tout ce qui est enregistré — textes comme photos — devient un fichier du
  dépôt GitHub. Rien n'est stocké sur un service tiers.

  La configuration (rubriques, champs, dossiers) est dans config.yml.
-->
