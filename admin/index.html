<!--
  Espace d'administration du site Cappellina.

  Propulsé par Sveltia CMS, qui écrit directement dans le dépôt GitHub :
  les photos déposées et les événements saisis deviennent des fichiers du
  dépôt, et Netlify redéploie le site automatiquement à chaque modification.
  Rien n'est stocké ailleurs que sur GitHub.

  La configuration (rubriques, champs, dossiers) est dans config.yml.
  La version est figée volontairement : mettre à jour le numéro ci-dessous
  pour passer à une version plus récente, après l'avoir testée.
-->
<script src="https://unpkg.com/@sveltia/cms@0.176.1/dist/sveltia-cms.js" type="module"></script>
